<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — 第一次迷路 · iiiiiei.com</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: Georgia, "Times New Roman", "Songti SC", serif; color: #fff; cursor: pointer; }
  #dots { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #vig { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }

  .mono { font-family: "Courier New", ui-monospace, monospace; }
  #brand { position: fixed; top: 20px; left: 22px; font-size: 11px; letter-spacing: .32em;
    color: #666; pointer-events: none; }
  #code { position: fixed; bottom: 20px; right: 22px; font-size: 11px; letter-spacing: .18em;
    color: #555; pointer-events: none; }

  #cap { position: fixed; left: 0; right: 0; bottom: 13vh; text-align: center;
    pointer-events: none; opacity: 0; transition: opacity .8s ease; }
  #cap.on { opacity: 1; }
  #cap .en { font-size: clamp(19px, 3.4vw, 30px); letter-spacing: .045em; font-style: italic; }
  #cap .zh { font-size: clamp(12px, 1.8vw, 16px); letter-spacing: .35em; color: #9a9a9a;
    margin-top: 12px; font-style: normal; }
  #hint { position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .4em; color: #6f6f6f; opacity: 0; transition: opacity .6s;
    pointer-events: none; animation: hb 1.8s ease-in-out infinite; }
  #hint.on { opacity: 1; }
  @keyframes hb { 50% { opacity: .25; } }

  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none;
    transition: opacity .5s ease; }
  #fade.on { opacity: 1; }
  .noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .noscript a { color: #fff; }
</style>
</head>
<body>
<canvas id="dots"></canvas>
<div id="vig"></div>
<div id="brand" class="mono">IIIIIEI · SIGNAL LOST</div>
<div id="code" class="mono">404 / NOT FOUND</div>
<div id="cap"><div class="en"></div><div class="zh"></div></div>
<div id="hint" class="mono">点击任意处回家 · CLICK TO GO HOME</div>
<div id="fade"></div>
<noscript><div class="noscript"><a href="/">回到主页 · HOME</a></div></noscript>

<script>
/* ============================================================
   404 点彩彩蛋 —— 致敬 OpenAI《The Intelligence Age》(Super Bowl 2025)
   的点阵视觉语言：黑底白点聚散成象，"the first …" 的叙事节奏。
   迷路本身被排成一部"人类第一次"小史，最后一扇门送你回家。
   零依赖 · Canvas 2D · 2026-09 iiiiiei.com
   ============================================================ */
(function () {
  'use strict';
  var REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('dots');
  var ctx = canvas.getContext('2d');
  var capEl = document.getElementById('cap');
  var hintEl = document.getElementById('hint');
  var fadeEl = document.getElementById('fade');
  var dpr = Math.min(devicePixelRatio || 1, 2);

  /* ---------- 主页地址：github.io 项目站去掉仓段，自定义域即根 ---------- */
  var seg = location.pathname.split('/')[1];
  var HOME = (location.hostname.endsWith('github.io') && seg && seg !== '404.html')
    ? '/' + seg + '/' : '/';

  /* ---------- 舞台（离屏 720×460 白色笔迹 → 采样成点阵目标） ---------- */
  var W = 720, H = 460;
  function stage404(c) {
    c.font = '900 300px Georgia, "Times New Roman", serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#fff';
    c.fillText('404', W / 2, H / 2);
  }
  function stageAntenna(c) {
    c.strokeStyle = '#fff'; c.lineCap = 'round';
    var ax = W / 2, ay = 150; // 塔尖
    // 发射塔：两根主腿 + 交叉横撑
    c.lineWidth = 13;
    c.beginPath();
    c.moveTo(ax - 130, 420); c.lineTo(ax, ay);
    c.moveTo(ax + 130, 420); c.lineTo(ax, ay);
    c.stroke();
    c.lineWidth = 8;
    for (var i = 0; i < 5; i++) {
      var t0 = i / 5, t1 = (i + 1) / 5;
      var y0 = 420 - (420 - ay) * t0, y1 = 420 - (420 - ay) * t1;
      var w0 = 130 * (1 - t0), w1 = 130 * (1 - t1);
      c.beginPath();
      c.moveTo(ax - w0, y0); c.lineTo(ax + w1, y1);
      c.moveTo(ax + w0, y0); c.lineTo(ax - w1, y1);
      c.stroke();
    }
    // 电波弧
    c.lineWidth = 9;
    [46, 86, 126].forEach(function (r) {
      c.beginPath(); c.arc(ax, ay, r, Math.PI * 1.18, Math.PI * 1.82); c.stroke();
    });
  }
  function stageChaplin(c) {
    var cx = W / 2, cy = 270, r = 95;
    c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineCap = 'round';
    // 头
    c.lineWidth = 11;
    c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke();
    // 圆顶礼帽：帽檐 + 帽冠
    c.lineWidth = 14;
    c.beginPath(); c.moveTo(cx - 108, cy - r + 18); c.lineTo(cx + 108, cy - r + 18); c.stroke();
    c.beginPath();
    c.moveTo(cx - 58, cy - r + 16);
    c.quadraticCurveTo(cx - 58, cy - r - 52, cx, cy - r - 52);
    c.quadraticCurveTo(cx + 58, cy - r - 52, cx + 58, cy - r + 16);
    c.lineWidth = 13; c.stroke();
    // 眼
    c.beginPath(); c.arc(cx - 34, cy - 16, 7.5, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(cx + 34, cy - 16, 7.5, 0, Math.PI * 2); c.fill();
    // 小胡子（两撇对称的贝塞尔）
    c.beginPath();
    c.moveTo(cx, cy + 34);
    c.bezierCurveTo(cx - 18, cy + 26, cx - 40, cy + 30, cx - 48, cy + 44);
    c.bezierCurveTo(cx - 34, cy + 50, cx - 12, cy + 46, cx, cy + 38);
    c.fill();
    c.beginPath();
    c.moveTo(cx, cy + 34);
    c.bezierCurveTo(cx + 18, cy + 26, cx + 40, cy + 30, cx + 48, cy + 44);
    c.bezierCurveTo(cx + 34, cy + 50, cx + 12, cy + 46, cx, cy + 38);
    c.fill();
  }
  function stageDoor(c) {
    var cx = W / 2, top = 70, w = 170, h = 330, r = w / 2;
    c.strokeStyle = '#fff'; c.fillStyle = '#fff'; c.lineCap = 'round';
    // 拱门
    c.lineWidth = 13;
    c.beginPath();
    c.moveTo(cx - w / 2, top + h);
    c.lineTo(cx - w / 2, top + r);
    c.arc(cx, top + r, r, Math.PI, 0);
    c.lineTo(cx + w / 2, top + h);
    c.stroke();
    // 地平线
    c.lineWidth = 8;
    c.beginPath(); c.moveTo(cx - 190, top + h + 2); c.lineTo(cx + 190, top + h + 2); c.stroke();
    // 锁孔（门发光的心脏）
    c.beginPath(); c.arc(cx, top + h * 0.42, 15, 0, Math.PI * 2); c.fill();
    c.beginPath();
    c.moveTo(cx - 8, top + h * 0.42 + 10);
    c.lineTo(cx + 8, top + h * 0.42 + 10);
    c.lineTo(cx, top + h * 0.42 + 40);
    c.fill();
  }
  var STAGES = [
    { draw: stage404,    en: 'the first time you got lost.', zh: '第 一 次 迷 路' },
    { draw: stageAntenna, en: 'the first dead channel.',     zh: '第 一 次 信 号 中 断' },
    { draw: stageChaplin, en: 'the first silent picture.',   zh: '第 一 部 默 片' },
    { draw: stageDoor,   en: 'the first door home.',         zh: '第 一 扇 回 家 的 门' },
  ];

  /* ---------- 采样：把舞台笔迹变成点阵目标 ---------- */
  var GAP = 7;
  function samplePoints(drawFn) {
    var off = document.createElement('canvas');
    off.width = W; off.height = H;
    var oc = off.getContext('2d');
    oc.fillStyle = '#000'; // 基底仅占位，采样看 alpha
    drawFn(oc);
    var img = oc.getImageData(0, 0, W, H).data;
    var pts = [];
    for (var y = 0; y < H; y += GAP)
      for (var x = 0; x < W; x += GAP) {
        var a = img[(y * W + x) * 4 + 3] / 255;
        if (a > 0.45) pts.push({ x: x / W, y: y / H, b: 0.55 + a * 0.45 });
      }
    // 打乱：分配给点池时聚散更有机
    for (var i = pts.length - 1; i > 0; i--) {
      var j = (i * 9301 + 49297) % (i + 1);
      var t = pts[i]; pts[i] = pts[j]; pts[j] = t;
    }
    return pts;
  }
  var STAGE_PTS = STAGES.map(function (s) { return samplePoints(s.draw); });

  /* ---------- 点池 ---------- */
  var dots = [];
  var N = Math.max(500, Math.min(3000, Math.floor(innerWidth * innerHeight / 420)));
  // 发光精灵：一次绘制，逐点 drawImage（比每点 shadowBlur 快两个量级）
  var SPRITE = document.createElement('canvas');
  SPRITE.width = SPRITE.height = 48;
  (function () {
    var sc = SPRITE.getContext('2d');
    var g = sc.createRadialGradient(24, 24, 0, 24, 24, 24);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.25, 'rgba(255,255,255,.85)');
    g.addColorStop(0.6, 'rgba(255,255,255,.16)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    sc.fillStyle = g; sc.fillRect(0, 0, 48, 48);
  })();

  var view = { x: 0, y: 0, w: 1, h: 1 }; // 舞台映射到屏幕的矩形
  function layout() {
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    var pad = Math.min(innerWidth, innerHeight) * 0.12;
    var aw = innerWidth - pad * 2, ah = innerHeight - pad * 2;
    var s = Math.min(aw / W, ah / H);
    view.w = W * s; view.h = H * s;
    view.x = (innerWidth - view.w) / 2;
    view.y = (innerHeight - view.h) / 2 - innerHeight * 0.03;
  }
  layout();
  addEventListener('resize', function () { layout(); assign(stage, 0); });

  var stage = -1, timer = 0, vortex = 0;
  var mouse = { x: -9999, y: -9999 };
  addEventListener('pointermove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener('pointerleave', function () { mouse.x = mouse.y = -9999; });

  function assign(s, stagger) {
    var pts = STAGE_PTS[s];
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i], p = pts[i % pts.length];
      var seed = (i * 7919 % 1000) / 1000;
      d.tx = view.x + p.x * view.w;
      d.ty = view.y + p.y * view.h;
      d.b = p.b;
      d.on = i < pts.length ? 1 : 0;              // 多余的点淡出退场
      d.delay = REDUCED ? 0 : seed * 260 + stagger;
      if (REDUCED) { d.x = d.tx; d.y = d.ty; d.a = d.on; }
    }
  }
  for (var i = 0; i < N; i++) {
    dots.push({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      tx: 0, ty: 0, a: 0, b: 1, on: 1, delay: 0,
      ph: Math.random() * Math.PI * 2, sp: 0.5 + Math.random(),
    });
  }

  var t0 = Date.now();
  function goHome() {
    if (vortex) return;
    vortex = Date.now();
    if (REDUCED) { fadeEl.classList.add('on'); setTimeout(function () { location.replace(HOME); }, 500); }
  }
  function next() {
    if (vortex) return;
    if (stage >= STAGES.length - 1) { goHome(); return; }
    stage++;
    var s = STAGES[stage];
    capEl.classList.remove('on');
    hintEl.classList.toggle('on', stage === STAGES.length - 1);
    assign(stage, 0);
    setTimeout(function () {
      capEl.querySelector('.en').textContent = s.en;
      capEl.querySelector('.zh').textContent = s.zh;
      capEl.classList.add('on');
    }, REDUCED ? 60 : 620);
    clearTimeout(timer);
    if (stage < STAGES.length - 1) timer = setTimeout(next, 4300);
  }
  addEventListener('click', function () { stage < 0 ? next() : (stage >= STAGES.length - 1 ? goHome() : next()); });
  // 首幕稍等半拍再起（页面呼吸感）
  setTimeout(next, 350);

  function frame() {
    requestAnimationFrame(frame);
    var now = Date.now(), t = (now - t0) / 1000;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.globalCompositeOperation = 'lighter';

    var vt = vortex ? (now - vortex) / 1100 : 0;
    if (vt >= 1) { location.replace(HOME); return; }

    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      if (now < t0 + d.delay && !vortex) continue;
      var ease = vortex ? 0.22 : 0.075;
      var px = d.tx, py = d.ty;
      if (!REDUCED) { // 待机呼吸：每点绕目标微游
        px += Math.sin(t * (0.6 + d.sp * 0.7) + d.ph) * 1.4;
        py += Math.cos(t * (0.5 + d.sp * 0.6) + d.ph * 1.7) * 1.4;
      }
      if (vortex) { // 旋涡回家：全部点被门吸走
        var dx = px - innerWidth / 2, dy = py - innerHeight / 2;
        var r = Math.hypot(dx, dy) * (1 - vt * 0.96), a = Math.atan2(dy, dx) + vt * 7 * (1 + d.sp);
        px = innerWidth / 2 + Math.cos(a) * r;
        py = innerHeight / 2 + Math.sin(a) * r;
      }
      // 鼠点排斥（迷路者推开星群）
      var mx = px - mouse.x, my = py - mouse.y, md = Math.hypot(mx, my);
      if (md < 90 && !vortex) {
        px += mx / md * (90 - md) * 0.35;
        py += my / md * (90 - md) * 0.35;
      }
      d.x += (px - d.x) * ease;
      d.y += (py - d.y) * ease;
      d.a += ((vortex ? Math.max(0, 1 - vt * 1.1) : d.on) - d.a) * 0.08;
      if (d.a < 0.02) continue;
      var sz = (3.2 + d.b * 3.4) * (0.8 + d.a * 0.4);
      ctx.globalAlpha = d.a * (0.5 + d.b * 0.5);
      ctx.drawImage(SPRITE, d.x - sz, d.y - sz, sz * 2, sz * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  frame();
})();
</script>
</body>
</html>
