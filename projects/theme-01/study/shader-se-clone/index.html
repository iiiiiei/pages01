    // 开发用错误面板：任何脚本错误直接亮在页面上

<script type="module">
import * as THREE from 'three';

/* ============================================================
   Pipeline study — 思想来自 shader.se 的公开拆解（见 README.md）：
   1. 页面分段配置 + 滚动进度驱动
   2. 选择性渲染：范围外场景零渲染
   3. FBO 场景链：倒序渲染，next 纹理逐级下传
   4. 视锥匹配穿屏（fitCameraToScreen）
   5. 屏幕空间采样揭示（gl_FragCoord）
   6. 最终 compose：grain / 色差 / 扫描线 / vignette / 穿幕闪断
   ============================================================ */

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// 诊断：着色器编译错误亮到页面（three 默认只走 console），并附出错行上下文
renderer.debug.onShaderError = (gl, program, vs, fs) => {
  try {
    const log = String(gl.getShaderInfoLog(fs) || '');
    const src = String(gl.getShaderSource(fs) || '').split('\n');
    const m = log.match(/0:(\d+)/);
    let ctx = '';
    if (m) {
      const ln = parseInt(m[1], 10);
      ctx = '\n>>> ' + src.slice(Math.max(0, ln - 3), ln + 2).map((s0, i) => (ln - 2 + i) + ': ' + s0).join('\n>>> ');
    }
    showErr('SHADER ERR: ' + log.slice(0, 160) + ctx);
  } catch { window.showErr && showErr('SHADER ERR: (no log)'); }
};
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- 设备分级：high / mid / low ---------------- */
const TIER = (() => {
  const coarse = matchMedia('(pointer: coarse)').matches;
  const cores = navigator.hardwareConcurrency || 4;
  if (REDUCED || coarse || cores <= 4) return 'low';
  return cores >= 8 ? 'high' : 'mid';
})();
const CFG = {
  high: { dpr: 2, fboScale: 0.9, bloom: true, dust: 340 },
  mid: { dpr: 1.5, fboScale: 0.75, bloom: true, dust: 220 },
  low: { dpr: 1, fboScale: 0.6, bloom: false, dust: 100 },
}[TIER];
const DPR = () => Math.min(devicePixelRatio || 1, CFG.dpr);
window.__TIER = TIER; // 诊断：控制台可查当前设备档

/* ---------------- GSAP 级缓动（等价实现，零依赖） ---------------- */
const easeInOutQuart = (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2);
const expoOut = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));

/* ---------------- 滚动 + 吸附（自研轻量平滑器，替代 Lenis）----------------
   Lenis 1.3.4 在部分环境出现不可复现的滚轮假死（isScrolling 卡 'smooth'，target 不更新）。
   自研：滚轮→target±delta（带吸附区方向倍率），帧内 lerp 到 target，原生滚动条/触屏经 scroll 事件同步。
   吸附机制还原参考站 snapPoints：锚点前 0.05 区间 ×1.8 吸入，刚越过 ×0.3 缓冲，键盘跳锚。 */
let progress = 0;
const SNAPS = [
  { id: '信号', p: 0 },
  { id: '屏内', p: 0.52 },
  { id: '终章', p: 0.97 },
];
const scroller = {
  limit: 1, target: 0, current: 0, from: 0, t0: 0,
  measure() {
    this.limit = Math.max(1, (document.body.scrollHeight - innerHeight));
    this.target = clamp(this.target, 0, this.limit);
  },
  multiplier(dy) { // 吸附区方向倍率（按事件方向，参考站做法）
    const cur = this.current / this.limit;
    const dir = dy >= 0 ? 1 : -1;
    let m = 1;
    for (const s of SNAPS) {
      if (s.p === 0 && dir > 0 && cur < 0.02) continue; // 起点不做缓冲：首滚必须顺滑（响应性根因）
      const d = (s.p - cur) * dir;
      if (d > 0 && d <= 0.05) m = Math.max(m, 1.8);    // 前方近锚：吸入加速
      if (d <= 0 && d >= -0.04) m = Math.min(m, 0.3);  // 刚越过：缓冲停靠（收窄）
    }
    return m;
  },
  wheel(dy) { this.target = clamp(this.target + dy * this.multiplier(dy), 0, this.limit); this.mark(); },
  mark() { this.from = this.current; this.t0 = performance.now(); }, // 去弹簧：动画从当前位置起算
  tick() {
    const D = 700;                                    // 700ms easeOutCubic，到点决停（无指数拖尾）
    const t = Math.min(1, (performance.now() - (this.t0 || 0)) / D);
    const e = 1 - Math.pow(1 - t, 3);
    this.current = this.from + (this.target - this.from) * e;
    if (t >= 1) this.current = this.target;
    window.scrollTo(0, this.current);
    progress = clamp(this.current / this.limit, 0, 1);
  },
};
addEventListener('scroll', () => { // 原生滚动（滚动条/触屏）同步虚拟目标。
  // 关键：仅在自身动画停止时同步——scrollTo 的 scroll 事件异步滞后，动画期间同步会自反馈打架（滚动失效根因）
  if (Math.abs(scroller.target - scroller.current) < 1 && Math.abs(window.scrollY - scroller.current) > 2) {
    scroller.target = scroller.current = window.scrollY;
  }
}, { passive: true });
addEventListener('wheel', (e) => {
  if (e.ctrlKey) return;
  e.preventDefault();
  scroller.wheel(clamp(e.deltaY, -900, 900));
}, { passive: false });
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const cur = scroller.current / scroller.limit;
  let target = null;
  if (e.key === 'ArrowDown' || e.key === 'PageDown') target = SNAPS.find((s) => s.p > cur + 0.01);
  if (e.key === 'ArrowUp' || e.key === 'PageUp') target = [...SNAPS].reverse().find((s) => s.p < cur - 0.01);
  if (e.key === 'Home') target = SNAPS[0];
  if (e.key === 'End') target = { p: 1 };
  if (target) { e.preventDefault(); scroller.target = target.p * scroller.limit; scroller.mark(); }
});
document.querySelectorAll('nav .links a[data-p]').forEach((a) => {
  a.addEventListener('click', (e) => {
    e.preventDefault();
    scroller.target = parseFloat(a.dataset.p) * scroller.limit;
    scroller.mark();
  });
});

/* ---------------- 鼠标视差 ---------------- */
const mouse = { x: 0, y: 0, sx: 0, sy: 0 };
addEventListener('pointermove', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = (e.clientY / innerHeight) * 2 - 1;
});

/* ---------------- 共享 uniform ---------------- */
const shared = {
  uTime: { value: 0 },
  uRes: { value: new THREE.Vector2(1, 1) },
};

/* ---------------- 程序化纹理工厂 ---------------- */
function makeCanvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const repaint = (...args) => { draw(c.getContext('2d'), c, ...args); tex.needsUpdate = true; };
  repaint();
  return { tex, repaint };
}

/* 字体就绪后重绘所有画布纹理（IBM Plex Mono 替换回退字体） */
const repaintFns = [];
if (document.fonts?.ready) document.fonts.ready.then(() => repaintFns.forEach((f) => f()));

/* ---------------- PBR 做旧：桌面木纹 ---------------- */
const wood = makeCanvasTexture(512, 512, (ctx, c) => {
  ctx.fillStyle = '#5e4b34'; ctx.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 150; i++) { // 纵向木纹
    const x = Math.random() * c.width;
    ctx.strokeStyle = `rgba(${42 + Math.random() * 28 | 0},${31 + Math.random() * 22 | 0},${19 + Math.random() * 14 | 0},${0.12 + Math.random() * 0.22})`;
    ctx.lineWidth = 1 + Math.random() * 3;
    ctx.beginPath(); ctx.moveTo(x, 0);
    ctx.bezierCurveTo(x + 9 * Math.sin(i), c.height * 0.33, x - 7 * Math.sin(i * 1.7), c.height * 0.66, x + 4 * Math.sin(i * 0.6), c.height);
    ctx.stroke();
  }
  for (let k = 0; k < 6; k++) { // 节疤
    const x = Math.random() * c.width, y = Math.random() * c.height, r = 9 + Math.random() * 15;
    const g = ctx.createRadialGradient(x, y, 1, x, y, r);
    g.addColorStop(0, 'rgba(30,22,12,.5)'); g.addColorStop(1, 'rgba(30,22,12,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r + 6, 0, 7); ctx.fill();
  }
});
wood.tex.wrapS = wood.tex.wrapT = THREE.RepeatWrapping; wood.tex.repeat.set(2, 1);

/* ---------------- PBR 做旧：壳体老化塑料（麻点 + 边角黄化） ---------------- */
const shellSkin = makeCanvasTexture(256, 256, (ctx, c) => {
  ctx.fillStyle = '#d8cba9'; ctx.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 2400; i++) {
    ctx.fillStyle = `rgba(${148 + Math.random() * 58 | 0},${128 + Math.random() * 40 | 0},${88 + Math.random() * 30 | 0},${Math.random() * 0.09})`;
    ctx.fillRect(Math.random() * c.width, Math.random() * c.height, 2, 2);
  }
  [[0, 0], [c.width, 0], [0, c.height], [c.width, c.height]].forEach(([x, y]) => {
    const g = ctx.createRadialGradient(x, y, c.width * 0.2, x, y, c.width * 0.75);
    g.addColorStop(0, 'rgba(122,94,44,.14)'); g.addColorStop(1, 'rgba(122,94,44,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
  });
});
shellSkin.tex.wrapS = shellSkin.tex.wrapT = THREE.RepeatWrapping;

/* ---------------- ASCII 字形图集（10×10，skyworks 视频转 ASCII 技法的静止版） ---------------- */
const ASCII_RAMP = ' .\',:;!i~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$';
const asciiAtlas = makeCanvasTexture(480, 480, (ctx, c) => {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#fff'; ctx.font = '34px "IBM Plex Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 100; i++) {
    const ch = ASCII_RAMP[Math.min(ASCII_RAMP.length - 1, Math.floor(i / 100 * ASCII_RAMP.length))];
    ctx.fillText(ch, (i % 10) * 48 + 24, Math.floor(i / 10) * 48 + 24);
  }
});
asciiAtlas.tex.magFilter = THREE.LinearFilter;
repaintFns.push(() => asciiAtlas.repaint());

/* WebGL 加载页内容（深蓝渐变+字标+百分比 → 进管线做真变形/遮罩/噪点） */
const glLoader = makeCanvasTexture(1024, 640, (ctx, c, pct = 0) => {
  const g = ctx.createLinearGradient(0, 0, 0, c.height);
  g.addColorStop(0, '#131a52'); g.addColorStop(1, '#232a80');
  ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#f2efe4'; ctx.textAlign = 'center';
  ctx.font = 'italic 700 96px Georgia, "Songti SC", serif';
  ctx.fillText('IIIIIEI', c.width / 2, 300);
  ctx.font = '34px Georgia, "Songti SC", serif';
  ctx.fillText('Loading ' + Math.round(pct * 100) + '%', c.width / 2, 380);
});
window.__loaderPaint = (v) => glLoader.repaint(Math.min(1, Math.max(0, v)));

/* 开机自检屏（琥珀单色终端，中文 BIOS） */
const boot = makeCanvasTexture(768, 576, (ctx, c, blink = true) => {
  ctx.fillStyle = '#030200'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#ffb000'; ctx.font = 'bold 52px "IBM Plex Mono", "Songti SC", monospace';
  ctx.fillText('IIIIIEI 系统', 48, 96);
  ctx.font = '28px "IBM Plex Mono", "Songti SC", monospace'; ctx.fillStyle = '#b97a00';
  const lines = [
    'BIOS v1.0  (C) 2026 IIIIIEI',
    '',
    '内存自检 ......... 640K 正常',
    '信号锁定 ......... 正常',
    '下一场景 ......... 待命',
    '',
    '> 正在载入 CRT 隧道' + (blink ? ' ▮' : '  '),
  ];
  lines.forEach((s, i) => ctx.fillText(s, 48, 180 + i * 46));
});
if (!REDUCED) setInterval(() => boot.repaint(Math.floor(Date.now() / 500) % 2 === 0), 500);
repaintFns.push(() => boot.repaint(true));

/* 屏内精排页：shader.se 式编辑部排版——纸页、衬线大标题、细线、矢量图解、页码 */
const SERIF = 'Georgia, "Times New Roman", "Songti SC", serif';
const MONO = '"IBM Plex Mono", "Songti SC", monospace';
const wrapZh = (ctx, text, x, y, n, lh) => {
  for (let i = 0; i * n < text.length; i++) ctx.fillText(text.slice(i * n, i * n + n), x, y + i * lh);
};
const STUDIES = [

  (ctx, x, y, w, h) => { // 倒序链 A←B←C
    const bw = w * 0.17, bh = h * 0.5, gap = w * 0.155;
    ['A', 'B', 'C'].forEach((ch, i) => {

  (ctx, x, y, w, h) => { // 视锥贴合屏幕

    const keys = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 0.105),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, metalness: 0.03 }), keyList.length);
    const dummy = new THREE.Object3D(), keyCol = new THREE.Color();
    keyList.forEach((k, i) => {
      dummy.position.set(k.xu * U - 0.29, PLATE_Y + (k.h / 2) + 0.02, k.zu * U);
      dummy.scale.set(k.w, k.h, 1);
      dummy.rotation.set(0.03 + Math.abs(k.jit) * 0.01, k.jit * 0.012, 0);
      dummy.updateMatrix(); keys.setMatrixAt(i, dummy.matrix);
      keys.setColorAt(i, keyCol.setHex(k.dark ? 0x9d8c68 : 0xdccfa9).offsetHSL(0, 0, k.jit * 0.008));
    });
    keys.instanceColor.needsUpdate = true;
    keys.castShadow = true; kbd.add(keys);
    kbd.position.set(0.0, 0.0, 1.38); kbd.rotation.x = -0.085;
    this.scene.add(kbd);
    // 连接线：键盘后沿 → 桌面绕行 → 显示器右下
    const cable = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
        new THREE.Vector3(0.35, 0.1, 1.4),

        new THREE.Vector3(1.35, 0.28, 1.05),
        new THREE.Vector3(1.1, 0.75, 0.35),
      ]), 28, 0.017, 8), M(0x2b2b30, 0.45));
    cable.castShadow = true; this.scene.add(cable);

    // ---------- 80s 静物：鼠标 / 软盘×2 / 报表堆 / 马克杯 ----------
    const mouse = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.055, 0.26), beige);
    mouse.position.set(1.7, 0.03, 1.6); mouse.rotation.y = -0.35; mouse.castShadow = true;
    this.scene.add(mouse);
    const floppyMat = M(0x23252b, 0.45), labelMat = M(0xe9e4d4, 0.85);
    [[-2.3, 1.15, 0.5, 0], [-2.0, 1.5, -0.25, 1]].forEach(([x, z, ry, drop]) => {
      const f = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.018, 0.58), floppyMat);

      const label = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.16), labelMat);

      const shutter = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 0.24), M(0xc9ccd4, 0.3, { metalness: 0.7 }));
      shutter.rotation.x = -Math.PI / 2; shutter.position.set(0.12, 0.011, 0.1); f.add(shutter);
      f.position.set(x, 0.012 + drop * 0.02, z); f.rotation.y = ry;
      this.scene.add(f);
    });
    for (let i = 0; i < 3; i++) {
      const paper = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.028, 1.1), M(0xe8e2d0, 0.9));
      paper.position.set(-3.1, 0.014 + i * 0.03, 1.15 + i * 0.05);
      paper.rotation.y = -0.3 + i * 0.12; paper.castShadow = true; this.scene.add(paper);
    }
    const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.3, 22), M(0xa89878, 0.5));
    mug.position.set(2.6, 0.15, 0.9); mug.castShadow = true; this.scene.add(mug);

    // ---------- 电影级布光：暖主光(带影) + 冷轮廓 + 屏幕溢光 ----------
    this.scene.add(new THREE.AmbientLight(0x58503e, 1.1));
    const keyLight = new THREE.SpotLight(0xffd2a0, 300, 45, 0.62, 0.55, 1.7);
    keyLight.position.set(5.5, 7.5, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024); keyLight.shadow.bias = -0.0004;
    keyLight.target = crt; this.scene.add(keyLight);
    const rim = new THREE.DirectionalLight(0x6f93c9, 1.5);

    this.screenGlowLight.position.set(0, 1.3, 1.5); this.scene.add(this.screenGlowLight);

    // ---------- 灰紫体积雾板（黑白世界的大气层次） ----------
    const hazeTex = makeCanvasTexture(512, 512, (ctx, c) => {
      const g = ctx.createRadialGradient(c.width / 2, c.height * 0.62, 30, c.width / 2, c.height * 0.62, c.width * 0.62);
      g.addColorStop(0, 'rgba(150,130,175,0.55)');
      g.addColorStop(0.5, 'rgba(90,78,110,0.28)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
    });
    const haze = new THREE.Mesh(new THREE.PlaneGeometry(26, 16), new THREE.MeshBasicMaterial({
      map: hazeTex.tex, transparent: true, opacity: 0.55, depthWrite: false,
    }));
    haze.position.set(0, 1.2, -6.5);
    this.scene.add(haze);
    const haze2 = haze.clone(); haze2.position.set(-5, 0.2, -3.5); haze2.scale.setScalar(0.7); this.scene.add(haze2);

    // ---------- 光锥浮尘 ----------
    const N = CFG.dust, dpos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      dpos[i * 3] = (Math.random() - 0.5) * 6.5;
      dpos[i * 3 + 1] = Math.random() * 5;
      dpos[i * 3 + 2] = (Math.random() - 0.5) * 5.5;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
    this.dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
      color: 0xffe6b8, size: 0.016, transparent: true, opacity: 0.45, depthWrite: false,
    }));
    this.scene.add(this.dust);

    // 相机机位
    this.camStart = new THREE.Vector3(3.6, 2.9, 5.6);
    this.camLookStart = new THREE.Vector3(0, 1.15, 0.2);
  }

  /* 视锥匹配：算出恰好铺满屏幕平面的相机位置（原站 fitCameraToScreen 思想） */
  fitCameraToScreen() {
    this.screen.updateWorldMatrix(true, false);
    const center = new THREE.Vector3().setFromMatrixPosition(this.screen.matrixWorld);
    const normal = new THREE.Vector3(0, 0, 1)
      .applyQuaternion(this.screen.getWorldQuaternion(new THREE.Quaternion())).normalize();
    const fov = THREE.MathUtils.degToRad(this.camera.fov);
    const h = 1.47, w = 1.95; // 屏幕平面的世界尺寸
    const dist = Math.max(
      (h / 2) / Math.tan(fov / 2),
      (w / 2) / (Math.tan(fov / 2) * this.camera.aspect),
    ) * 0.92; // 乘 0.92：留一点壳边防穿帮（原站同款保险）
    return { pos: center.clone().add(normal.multiplyScalar(dist)), lookAt: center };
  }

  render(state, nextTexture) {
    const p = state.progress, t = state.time;
    this.screenMat.uniforms.uNext.value = nextTexture;
    this.screenMat.uniforms.uMix.value = smoothstep(0.10, 0.36, p);
    this.screenMat.uniforms.uTime.value = t;

    const fly = easeInOutQuart(smoothstep(0.02, 0.44, p)); // 有分量的推进（quart 曲线）

    // CRT 开机序列：闪两下再稳（页面加载后前 0.6s）
    const boot0 = t < 0.12 ? 2.2 : t < 0.22 ? 0.15 : t < 0.34 ? 1.3 : t < 0.5 ? 0.55 : 1.0;
    this.screenMat.uniforms.uPower.value = REDUCED ? 1 : boot0;

    // 屏幕溢光：boot 期琥珀 → 穿屏期转绿；鼠标移近屏幕中心增亮
    const near = 1 - Math.min(1, Math.hypot(mouse.sx, mouse.sy));
    this.screenGlowLight.intensity = (16 + near * 20) * this.screenMat.uniforms.uPower.value;
    this.screenGlowLight.color.setHex(fly > 0.45 ? 0x53ff9a : 0xffb000);
    this.led.material.color.setHex(this.screenMat.uniforms.uPower.value > 0.8 ? 0x6cff9a : 0x1d4a2e);

    // 浮尘缓慢漂移
    if (!REDUCED) {
      this.dust.rotation.y = t * 0.012;
      this.dust.position.y = Math.sin(t * 0.1) * 0.08;
    }

    const fit = this.fitCameraToScreen();
    const breath = REDUCED ? 0 : Math.sin(t * 0.8) * 0.045 * (1 - fly);
    this.camera.position.lerpVectors(this.camStart, fit.pos, fly);
    this.camera.position.y += breath;
    this.camera.position.x += mouse.sx * 0.35 * (1 - fly);
    this.camera.position.y += -mouse.sy * 0.18 * (1 - fly);
    this.camera.lookAt(new THREE.Vector3().lerpVectors(this.camLookStart, fit.lookAt, fly));
    if (fly > 0.999) { this.camera.position.copy(fit.pos); this.camera.lookAt(fit.lookAt); }

    renderer.setRenderTarget(this.fbo);
    renderer.render(this.scene, this.camera);
    renderer.setRenderTarget(null);
    return this.fbo.texture;
  }
}

/* ============================================================
   SCENE B · INSIDE — 屏幕内的终端次元 + 噪声揭示层
   ============================================================ */
class InsideScene {
  constructor() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x010604);
    this.scene.fog = new THREE.FogExp2(0x010604, 0.052);
    this.camera = new THREE.PerspectiveCamera(58, 1, 0.1, 80);
    this.activeRange = [0.36, 1.05];
    this.scene.add(this.camera); // 揭示层挂在相机上，屏幕空间采样

    // 发光网格地面（消费鼠标权重贴图：拖尾推开网格 + 点亮，"鼠标即光"）
    const grid = new THREE.Mesh(new THREE.PlaneGeometry(70, 220, 1, 1), mat(/* glsl */`
      varying vec2 vUv; uniform float uTime; uniform vec2 uRes; uniform sampler2D uMouseW;
      void main() {
        vec3 mw = texture2D(uMouseW, gl_FragCoord.xy / uRes).rgb;
        vec2 mdir = mw.rg * 2.0 - 1.0;
        vec2 guv = vUv + mdir * mw.b * 0.010;            // 拖尾轻推网格坐标
        vec2 g = abs(fract(vec2(guv.x * 35.0, guv.y * 110.0 + uTime * 2.0)) - 0.5);
        float line = smoothstep(0.06, 0.0, min(g.x, g.y));
        line = min(line + mw.b * 0.9, 1.0);              // 扫过之处网格点亮
        float fade = smoothstep(0.0, 0.25, vUv.y) * smoothstep(1.0, 0.55, vUv.y);
        vec3 col = mix(vec3(0.0, 0.35, 0.18), vec3(0.2, 1.0, 0.55), line);
        gl_FragColor = vec4(col * line * 1.6 * fade + col * 0.04 + vec3(0.1, 0.5, 0.3) * mw.b * fade, 1.0);
      }`, { uMouseW: { value: null }, __tag: "insideGrid" }));
    grid.rotation.x = -Math.PI / 2; grid.position.y = -2.6; this.scene.add(grid);
    this.gridMat = grid.material;

    // ---------- 机架墙：两侧立柱框架（与卡片同节律，撑起隧道空间感） ----------
    const rackMat = new THREE.MeshStandardMaterial({ color: 0x0d2418, roughness: 0.55, metalness: 0.35 });
    const stripMat = new THREE.MeshBasicMaterial({ color: 0x1f8f55 });
    const FRAMES = 9;
    const racks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.2, 6.4, 0.2), rackMat, FRAMES * 4);
    const strips = new THREE.InstancedMesh(new THREE.BoxGeometry(0.06, 5.2, 0.06), stripMat, FRAMES * 2);
    const rd = new THREE.Object3D();
    let ri = 0, si = 0;
    for (let f = 0; f < FRAMES; f++) {
      const z = -6 - f * 4.4;
      for (const x of [-5.4, 5.4]) for (const dy of [-0.9, 0.9]) {
        rd.position.set(x, dy, z); rd.updateMatrix(); racks.setMatrixAt(ri++, rd.matrix);
      }
      for (const x of [-5.05, 5.05]) {
        rd.position.set(x, 0, z); rd.updateMatrix(); strips.setMatrixAt(si++, rd.matrix);
      }
    }
    this.scene.add(racks, strips);

    // ---------- 顶部线缆：三根沿隧道顶蜿蜒 ----------
    const cableMat = new THREE.MeshStandardMaterial({ color: 0x103526, roughness: 0.5, metalness: 0.2 });
    [[-1.6, 0.9], [0.2, 1.3], [1.7, 0.7]].forEach(([x, sag], i) => {
      const pts = [];
      for (let z = 8; z >= -34; z -= 4)
        pts.push(new THREE.Vector3(x + Math.sin(z * 0.35 + i) * 0.35, 2.7 + Math.sin(z * 0.5 + i * 2) * sag * 0.5 - sag * 0.3, z));
      this.scene.add(new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.035, 6), cableMat));
    });

    // ---------- 尽头核心光：隧道终端的信号源 ----------
    const coreTex = makeCanvasTexture(256, 256, (ctx, c) => {
      const g = ctx.createRadialGradient(c.width / 2, c.height / 2, 6, c.width / 2, c.height / 2, c.width / 2);
      g.addColorStop(0, 'rgba(120,255,190,1)');
      g.addColorStop(0.35, 'rgba(40,220,130,.35)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
    });
    this.core = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), new THREE.MeshBasicMaterial({
      map: coreTex.tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    this.core.position.set(0, 0.4, -47);
    this.scene.add(this.core);
    const coreLight = new THREE.PointLight(0x39ff88, 40, 60, 1.6);
    coreLight.position.set(0, 0.4, -42);
    this.scene.add(coreLight);

    // ---------- 浮游微粒：信号尘埃 ----------
    const MD = 160, mpos = new Float32Array(MD * 3);
    for (let i = 0; i < MD; i++) {
      mpos[i * 3] = (Math.random() - 0.5) * 9;
      mpos[i * 3 + 1] = Math.random() * 4 - 1.5;
      mpos[i * 3 + 2] = 6 - Math.random() * 36;
    }
    const motesGeo = new THREE.BufferGeometry();
    motesGeo.setAttribute('position', new THREE.BufferAttribute(mpos, 3));
    this.motes = new THREE.Points(motesGeo, new THREE.PointsMaterial({
      color: 0x53ff9a, size: 0.025, transparent: true, opacity: 0.5, depthWrite: false,
    }));
    this.scene.add(this.motes);

    // 学习卡片：两侧交错，随相机前进逐一掠过
    this.cards = cardTextures.map(({ tex }, i) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(1.78, 2.225), // 竖开本 640×800
        new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
      const side = i % 2 === 0 ? -1 : 1;
      m.position.set(side * 3.1, 0.4 + (i % 3) * 0.5, -4 - i * 4.4);
      m.rotation.y = side * -0.5;
      m.userData.phase = i * 1.7;
      m.userData.baseY = 0.4 + (i % 3) * 0.5;
      this.scene.add(m);
      return m;
    });

    // 章节横幅：与纸页同语言的编辑部题头
    const banner = makeCanvasTexture(1024, 128, (ctx, c) => {
      ctx.fillStyle = '#f3f0e7'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.strokeStyle = '#23201a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(24, 10); ctx.lineTo(c.width - 24, 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(24, c.height - 10); ctx.lineTo(c.width - 24, c.height - 10); ctx.stroke();
      ctx.fillStyle = '#23201a'; ctx.font = '700 54px ' + SERIF; ctx.textAlign = 'left';
      ctx.fillText('屏内信号', 44, 86);
      ctx.font = '500 21px ' + MONO; ctx.fillStyle = '#6b6552'; ctx.textAlign = 'right';
      try { ctx.letterSpacing = '4px'; } catch (e) {}
      ctx.fillText('SIX STUDIES · INSIDE THE SIGNAL', c.width - 44, 80);
      try { ctx.letterSpacing = '0px'; } catch (e) {}
      ctx.textAlign = 'left';
    });
    repaintFns.push(() => banner.repaint());
    this.banner = new THREE.Mesh(new THREE.PlaneGeometry(6, 0.75),
      new THREE.MeshBasicMaterial({ map: banner.tex, transparent: true }));
    this.banner.position.set(0, 2.4, -1.5); this.scene.add(this.banner);

    // 揭示层：屏幕空间采样下一场景（挂相机、禁深度、最后渲染）
    this.revealMat = mat(/* glsl */`
      uniform sampler2D uNext; uniform float uReveal; uniform vec2 uRes;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
                   mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
      }
      void main() {
        vec2 suv = gl_FragCoord.xy / uRes;              // 屏幕空间，而非 UV
        float n = noise(gl_FragCoord.xy / 9.0) * 0.6 + noise(gl_FragCoord.xy / 33.0) * 0.4;
        float open = smoothstep(uReveal - 0.06, uReveal + 0.06, n); // 噪声阈值推进
        float edge = smoothstep(0.12, 0.0, abs(n - uReveal)) * step(0.02, uReveal);
        vec3 col = texture2D(uNext, suv).rgb + vec3(0.1, 1.0, 0.4) * edge * 0.8;
        gl_FragColor = vec4(col, 1.0 - open);
      }`, { uNext: { value: null }, uReveal: { value: 0 } },
      { transparent: true, depthTest: false, depthWrite: false });
    this.reveal = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), this.revealMat);
    this.reveal.renderOrder = 10;
    this.camera.add(this.reveal);
  }

  fitRevealToCamera() {
    const d = 0.5, fov = THREE.MathUtils.degToRad(this.camera.fov);
    const h = 2 * d * Math.tan(fov / 2), w = h * this.camera.aspect;
    this.reveal.scale.set(w, h, 1);
    this.reveal.position.set(0, 0, -d);
  }

  render(state, nextTexture) {
    const p = state.progress, t = state.time;
    const fly = expoOut(smoothstep(0.47, 0.86, p)); // 隧道 dolly 减速落定
    this.camera.position.set(
      mouse.sx * 0.6,
      0.6 + mouse.sy * 0.25,
      lerp(7.5, -23, fly),
    );
    this.camera.lookAt(mouse.sx * 1.2, 0.6 + mouse.sy * 0.4, this.camera.position.z - 8);
    this.cards.forEach((c) => {
      c.lookAt(this.camera.position);
      // 出场：相机临近时 expoOut 落位（有重量的浮现，替代原地静挂）
      const ahead = this.camera.position.z - c.position.z; // 前方为正
      const app = expoOut(clamp(1 - ahead / 10, 0, 1));
      c.scale.setScalar(0.55 + 0.45 * app);
      c.position.y = c.userData.baseY + (1 - app) * 0.9
        + (REDUCED ? 0 : Math.sin(t * 0.9 + c.userData.phase) * 0.12);
    });
    this.revealMat.uniforms.uNext.value = nextTexture;
    this.revealMat.uniforms.uReveal.value = smoothstep(0.80, 0.95, p);
    this.fitRevealToCamera();
    // 核心光呼吸 + 信号尘埃缓漂
    if (!REDUCED) {
      this.core.scale.setScalar(0.92 + Math.sin(t * 1.6) * 0.08);
      this.motes.position.z = (t * 0.35) % 4.4;
    }

    renderer.setRenderTarget(this.fbo);
    renderer.render(this.scene, this.camera);
    renderer.setRenderTarget(null);
    return this.fbo.texture;
  }
}

/* ============================================================
   COMPOSE — 最终合成：色差 / 扫描线 / grain / vignette / 穿幕闪断
   ============================================================ */
const composeMat = mat(/* glsl */`
  uniform sampler2D uSceneA, uSceneB;
  uniform vec2 uRes;
  uniform float uSwap, uTime, uAberr, uFilm, uGlass, uGlassFlash, uContact, uAspect;
  uniform sampler2D uMouseW;
  varying vec2 vUv;
  float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
  /* 屏外世界：卓别林黑白胶片。颗粒按亮度遮罩（参考站做法：亮部才有颗粒），零抖动。
     wipe：鼠标权重拖尾——扫过之处"抹灰见亮"（鼠标即光） */
  vec3 filmGrade(vec3 c, vec2 uv, float t, float wipe) {
    float l = dot(c, vec3(0.299, 0.587, 0.114));
    l = clamp((l - 0.5) * 1.12 + 0.49, 0.0, 1.0); // 柔和对比，保留暗部细节
    l += (hash(uv * uRes * 1.6 + floor(t * 24.0) * 7.3) - 0.5)
       * (0.012 + 0.05 * smoothstep(0.45, 0.95, l)); // 暗部近零、亮部参考站量级
    float col = floor(uv.x * 210.0);
    float scr = step(0.9975, hash(vec2(col, floor(t * 3.0))));         // 偶尔一根划痕
    l += scr * 0.14 * hash(vec2(col, floor(uv.y * 50.0) + floor(t * 24.0)));
    l *= 0.99 + 0.01 * sin(t * 8.0 + sin(t * 3.7) * 2.0);              // 放映机呼吸（极弱）
    l *= 1.0 - smoothstep(0.5, 1.0, length(uv - 0.5)) * 0.3;           // 老镜头暗角
    l += wipe * 0.12;                                                   // 抹灰见亮
    return vec3(l);
  }
  /* shader.se 式凸面变形（从其生产 bundle 的 DH+DV 还原）：先外扩再 (1-k) 缩回，角落不越界 */
  vec2 lensBarrel(vec2 uv, float k) {
    vec2 i = uv - 0.5;
    float n = dot(i, i);
    vec2 scaled = (vec2(1.0 - k)) * (i * (1.0 + n * k) + vec2(0.5));
    return scaled + vec2(k * 0.5);
  }
  /* 圆角矩形 SDF（参考其 SampleComposeTexture 的 rounded 采样遮罩） */
  float sdRound(vec2 p, vec2 b, float r) {
    vec2 q = abs(p) - (b - vec2(r));
    return min(max(q.x, q.y), 0.0) + length(max(q, vec2(0.0))) - r;
  }
  void main() {
    // 参考站零抖动：不做片门位移
    vec2 uv = vUv;
    // 屏内：凸面 + 大圆角窄边遮罩常驻（#contact 同款），穿屏时快速收紧到位
    vec2 suv = mix(uv, lensBarrel(uv, 0.14), uGlass * uGlassFlash);
    // 终章（contact 式页面）：桶形外扩 + 大圆角窄边遮罩（参考站 #contact 实测形态）
    suv = mix(suv, lensBarrel(suv, 0.13), uContact);

    vec3 a = texture2D(uSceneA, suv).rgb;
    vec3 b = texture2D(uSceneB, suv).rgb;
    vec3 col = mix(a, b, uSwap);
    // 色差：随离心距缩放（镜头物理正确），纵向偏移，屏边 0.5% 淡出防红边（skyworks 技法）
    float rad = length(vUv - 0.5) * 2.0;
    float off = 0.0012 * rad * uAberr;
    vec3 colR = mix(texture2D(uSceneA, suv + vec2(0.0, -off)).rgb, texture2D(uSceneB, suv + vec2(0.0, -off)).rgb, uSwap);
    vec3 colB = mix(texture2D(uSceneA, suv + vec2(0.0, off)).rgb, texture2D(uSceneB, suv + vec2(0.0, off)).rgb, uSwap);
    vec3 ab = vec3(colR.r, col.g, colB.b);
    float em = 0.005;
    float ef = min(smoothstep(0.0, em, vUv.x), smoothstep(0.0, em, 1.0 - vUv.x))
             * min(smoothstep(0.0, em, vUv.y), smoothstep(0.0, em, 1.0 - vUv.y));
    col = mix(col, ab, ef);

    col = mix(col, filmGrade(col, uv, uTime, 0.0), uFilm); // 屏外：默片时代（干净胶片，鼠标拖尾只在屏内网格生效）

    // 屏内常驻遮罩（与 CRT 屏窗同一几何：穿屏时物理屏窗 → 渐变为视口遮罩，无框中框）
    if (uGlass * uGlassFlash > 0.001) {
      float g = uGlass * uGlassFlash;
      vec2 p = (suv - 0.5) * vec2(uAspect, 1.0);
      vec2 halfSize = vec2(uAspect, 1.0) * 0.5 - 0.028;
      float d = sdRound(p, halfSize, 0.16);
      float insideMask = smoothstep(0.0, 0.010, -d);
      vec3 screenCol = col * (0.82 + 0.18 * smoothstep(0.0, 0.35, -d));
      float rim = smoothstep(0.04, 0.008, -d);
      screenCol += rim * vec3(0.03, 0.06, 0.05);
      col = mix(col, mix(vec3(0.0), screenCol, insideMask), g);
    }

    // 终章：不另起边框（同一遮罩系统）——只加重对比与微增凸面，作为"页尾"的分量
    if (uContact > 0.001) {
      vec3 screenCol = pow(max(col, 0.0), vec3(mix(1.0, 1.14, uContact)));
      col = mix(col, screenCol, uContact * 0.85);
    }

    // 扫描线/颗粒/暗角/穿幕闪断移至 final pass（bloom 之后、色调映射之后再上质感）
    gl_FragColor = vec4(col, 1.0);
  }`, {
  uSceneA: { value: null }, uSceneB: { value: null },
  uSwap: { value: 0 }, uFilm: { value: 1 }, uGlass: { value: 0 }, uGlassFlash: { value: 0 }, uContact: { value: 0 },
  uAberr: { value: 1.4 }, uAspect: { value: 1 }, uMouseW: { value: null }, __tag: "compose" });

/* ---------- bloom：UE4 式 mip 金字塔（skyworks 技法）----------
   4-tap 半纹素降采样 ×3 级（亮度阈值熔进首级，省全分辨率 pass）
   + tent 上采样逐级按 radius 混合。宽、软、省。 */
const downFirstMat = mat(/* glsl */`
  uniform sampler2D uTex; uniform vec2 uTexel;
  varying vec2 vUv;
  void main() {
    vec2 h = uTexel * 0.5;
    vec3 c = vec3(0.0);
    vec2 o[4]; o[0]=vec2(-1.,1.); o[1]=vec2(1.,1.); o[2]=vec2(-1.,-1.); o[3]=vec2(1.,-1.);
    for (int i = 0; i < 4; i++) {
      vec3 t = texture2D(uTex, vUv + h * o[i]).rgb;
      float l = max(t.r, max(t.g, t.b));
      c += t * smoothstep(0.72, 0.78, l); // preFilter：熔进首级降采样
    }
    gl_FragColor = vec4(c * 0.25, 1.0);
  }`, { uTex: { value: null }, uTexel: { value: new THREE.Vector2() }, __tag: "bloomDownFirst" });

const downMat = mat(/* glsl */`
  uniform sampler2D uTex; uniform vec2 uTexel;
  varying vec2 vUv;
  void main() {
    vec2 h = uTexel * 0.5;
    vec3 c = texture2D(uTex, vUv + h * vec2(-1., 1.)).rgb + texture2D(uTex, vUv + h * vec2(1., 1.)).rgb
           + texture2D(uTex, vUv + h * vec2(-1., -1.)).rgb + texture2D(uTex, vUv + h * vec2(1., -1.)).rgb;
    gl_FragColor = vec4(c * 0.25, 1.0);
  }`, { uTex: { value: null }, uTexel: { value: new THREE.Vector2() }, __tag: "bloomDown" });

const upMat = mat(/* glsl */`
  uniform sampler2D uTex; uniform sampler2D uSupport; uniform vec2 uTexel; uniform float uRadius;
  varying vec2 vUv;
  void main() {
    vec2 h = uTexel * 0.5;
    vec3 f = texture2D(uTex, vUv + h * vec2(-1., 1.)).rgb + texture2D(uTex, vUv + h * vec2(1., 1.)).rgb
           + texture2D(uTex, vUv + h * vec2(-1., -1.)).rgb + texture2D(uTex, vUv + h * vec2(1., -1.)).rgb;
    gl_FragColor = vec4(mix(texture2D(uSupport, vUv).rgb, f * 0.25, uRadius), 1.0);
  }`, { uTex: { value: null }, uSupport: { value: null }, uTexel: { value: new THREE.Vector2() }, uRadius: { value: 0.85 }, __tag: "bloomUp" });

/* ---------- 鼠标权重通道（skyworks 技法）----------
   乒乓 FBO 反馈拖尾：胶囊线段 SDF 落笔（快速移动不断线）×速度强度，
   pow(0.2,δ) 帧率无关衰减；输出 RG=方向 B=强度。输入端三组弹簧。 */
const mouseMat = mat(/* glsl */`
  uniform sampler2D uPrev; uniform vec2 uMouse, uPrevMouse, uDir;
  uniform float uVel, uDelta;
  varying vec2 vUv;
  void main() {
    vec2 a = uPrevMouse; vec2 b = uMouse; // 均为 0..1
    vec2 ab = b - a;
    float t = clamp(dot(vUv - a, ab) / max(dot(ab, ab), 0.000001), 0.0, 1.0);
    float line = 1.0 - smoothstep(0.03, 0.16, length(vUv - (a + ab * t)));
    float ptr = 1.0 - smoothstep(0.0, 0.22, length(vUv - b));
    float stamp = max(line, ptr) * 1.2 * uVel;
    vec3 prev = texture2D(uPrev, vUv).rgb;
    float w = max(prev.b * pow(0.2, uDelta), stamp);
    vec2 dir = mix(prev.rg, uDir * 0.5 + 0.5, clamp(stamp, 0.0, 1.0));
    gl_FragColor = vec4(dir, w, 1.0);
  }`, {
  uPrev: { value: null }, uMouse: { value: new THREE.Vector2(0.5, 0.5) },
  uPrevMouse: { value: new THREE.Vector2(0.5, 0.5) }, uDir: { value: new THREE.Vector2(0, 1) },
  uVel: { value: 0 }, uDelta: { value: 1 / 60 },
  __tag: "mouseWeight", });

/* 弹簧积分器（等价 Motion 的 stiffness/damping，零依赖） */
function makeSpring(k, c) {
  return { x: 0, v: 0, step(target, dt) { this.v += ((target - this.x) * k - this.v * c) * dt; this.x += this.v * dt; return this.x; } };
}
const mwSprings = {
  x: makeSpring(180, 22), y: makeSpring(180, 22),
  dx: makeSpring(110, 18), dy: makeSpring(110, 18),
  vel: makeSpring(150, 20),
};
const mwState = { last: 0, px: 0.5, py: 0.5, ping: true };

/* ---------- final：辉光合成 + ACES 色调映射 + 扫描线/颗粒/暗角/穿幕闪 ---------- */
const finalMat = mat(/* glsl */`
  uniform sampler2D uScene, uBloom;
  uniform vec2 uRes;
  uniform float uBloomAmt, uDip, uScan, uGrain, uVig, uTime;
  varying vec2 vUv;
  float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
  vec3 aces(vec3 x) { // Narkowicz ACES 近似：高光有滚降，不再死白
    return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
  }
  void main() {
    vec3 col = texture2D(uScene, vUv).rgb + texture2D(uBloom, vUv).rgb * uBloomAmt;
    col = aces(col * 1.06); // 轻提曝再压曲线
    float scan = 1.0 - uScan * 0.22 * (0.5 + 0.5 * sin(vUv.y * uRes.y * 2.6));
    col *= scan;
    // 颗粒：高斯 PDF 成形（skyworks）——正亮度"银盐"颗粒，暗部略强（负片特性）
    float h = hash(vUv * (uTime + 1.0));
    float lum = max(col.r, max(col.g, col.b));
    float grain = 0.5699 * exp(-(h * h) / 0.245); // σ=0.35
    col += grain * uGrain * (0.6 + 0.6 * (1.0 - lum));
    vec2 d = vUv - 0.5;
    col *= 1.0 - smoothstep(0.45, 0.95, length(d)) * uVig;
    col *= 1.0 - uDip;
    gl_FragColor = vec4(col, 1.0);
  }`, {
  uScene: { value: null }, uBloom: { value: null },
  uBloomAmt: { value: 0 }, uDip: { value: 0 }, uScan: { value: 0.1 }, uGrain: { value: 0.035 }, uVig: { value: 0.75 }, __tag: "final" });

/* 加载页 pass：真 lensBarrel + 圆角遮罩 + 高斯 PDF 颗粒（与站点同一套 GLSL） */
const loaderPassMat = mat(/* glsl */`
  uniform sampler2D uTex; uniform float uFade;
  varying vec2 vUv;
  float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
  vec2 lensBarrel(vec2 uv, float k) {
    vec2 i = uv - 0.5;
    float n = dot(i, i);
    return (1.0 - k) * (i * (1.0 + n * k) + vec2(0.5)) + vec2(k * 0.5);
  }
  float sdRound(vec2 p, vec2 b, float r) {
    vec2 q = abs(p) - (b - vec2(r));
    return min(max(q.x, q.y), 0.0) + length(max(q, vec2(0.0))) - r;
  }
  void main() {
    vec2 uv = lensBarrel(vUv, 0.12);
    vec3 col = texture2D(uTex, uv).rgb;
    vec2 p = (uv - 0.5) * 2.0;
    float d = sdRound(p, vec2(2.0) - vec2(0.056), 0.32);
    col *= 0.86 + 0.14 * smoothstep(0.0, 0.3, -d);
    col *= smoothstep(0.0, 0.012, -d);
    float h = hash(uv * 617.0);
    col += 0.5699 * exp(-(h * h) / 0.245) * 0.06;
    gl_FragColor = vec4(col * uFade, 1.0);
  }`, { uTex: { value: glLoader.tex }, uFade: { value: 1 } });
let loaderPhase = 'gl';

const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
postCam.position.z = 5; // 平面落在视锥中部，远离 near/far 边界
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), composeMat);
postScene.add(postQuad);

/* 后期用的渲染目标：全分辨率场景帧 + mip 金字塔 bloom ×5 + 鼠标权重乒乓 ×2 */
function makeRT() {
  return new THREE.WebGLRenderTarget(1, 1, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false,
  });
}
const sceneRT = makeRT();
const pyr = { d0: makeRT(), d1: makeRT(), d2: makeRT(), u1: makeRT(), u0: makeRT() };
const mwRT = [makeRT(), makeRT()];
const blackTex = makeCanvasTexture(2, 2, (ctx, c) => { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 2, 2); }).tex;

/* 鼠标权重通道每帧驱动（在场景渲染前跑，半分辨率、一 pass） */
function updateMouseWeight(t) {
  const dt = Math.min(t - mwState.last || 1 / 60, 1 / 30);
  mwState.last = t;
  const prevX = mwState.px, prevY = mwState.py; // 上一帧弹簧输出
  // y 翻转：clientY 是 top-down，GL 纹理 uv 是 bottom-up——不翻会导致轨迹垂直镜像（"反向轨迹"）
  const px = mwSprings.x.step((mouse.x + 1) / 2, dt);
  const py = mwSprings.y.step(1 - (mouse.y + 1) / 2, dt);
  const ddx = px - prevX, ddy = py - prevY;
  const dl = Math.hypot(ddx, ddy);
  if (dl > 1e-4) { mwSprings.dx.step(ddx / dl, dt); mwSprings.dy.step(ddy / dl, dt); }
  const vel = mwSprings.vel.step(clamp(dl / Math.max(dt, 1 / 120), 0, 1) * 1.5, dt);
  mwState.px = px; mwState.py = py;
  const u = mouseMat.uniforms;
  u.uPrev.value = mwRT[mwState.ping ? 1 : 0].texture;
  u.uMouse.value.set(px, py);
  u.uPrevMouse.value.set(prevX, prevY);
  u.uDir.value.set(mwSprings.dx.x, mwSprings.dy.x);
  u.uVel.value = REDUCED ? 0 : vel;
  u.uDelta.value = dt;
  postQuad.material = mouseMat;
  renderer.setRenderTarget(mwRT[mwState.ping ? 0 : 1]);
  renderer.render(postScene, postCam);
  mwState.ping = !mwState.ping;
  return mwRT[mwState.ping ? 1 : 0].texture; // 刚写完的那张
}

/* ============================================================
   组装：场景链 + 主循环
   ============================================================ */
const scenes = [new HeroScene(), new InsideScene(), new EndScene()];
function makeFBO() {
  return new THREE.WebGLRenderTarget(1, 1, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    depthBuffer: true,
  });
}
scenes.forEach((s) => { s.fbo = makeFBO(); });

function resize() {
  const w = innerWidth, h = innerHeight, dpr = DPR();
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h);
  const fw = Math.floor(w * dpr * CFG.fboScale), fh = Math.floor(h * dpr * CFG.fboScale);
  scenes.forEach((s) => {
    s.camera.aspect = w / h; s.camera.updateProjectionMatrix();
    s.fbo.setSize(fw, fh); // 按设备分档降采样换性能
  });
  // uRes 以 FBO 像素为准：gl_FragCoord 类效果（揭示层）在 FBO 内采样才会对齐
  shared.uRes.value.set(fw, fh);
  composeMat.uniforms.uAspect.value = w / h; // 玻璃圆角边框需要宽高比
  sceneRT.setSize(Math.floor(w * dpr), Math.floor(h * dpr));       // 后期全分辨率帧
  const half2 = (k) => [Math.max(2, Math.floor(w * dpr / k)), Math.max(2, Math.floor(h * dpr / k))];
  pyr.d0.setSize(...half2(2)); pyr.u0.setSize(...half2(2));         // mip 金字塔
  pyr.d1.setSize(...half2(4)); pyr.u1.setSize(...half2(4));
  pyr.d2.setSize(...half2(8));
  mwRT[0].setSize(...half2(2)); mwRT[1].setSize(...half2(2));       // 鼠标权重乒乓
}
addEventListener('resize', () => { scroller.measure(); resize(); });
scroller.measure(); // 布局就绪后测量滚动范围（缺失则 limit=1，滚轮被钳死——滚动失效根因）
resize();

// UI 状态
const secNum = document.getElementById('secNum');
const secName = document.getElementById('secName');
const hint = document.getElementById('hint');
const loader = document.getElementById('loader');

// 预热：每个场景先渲一帧，保证 FBO 有内容可供链上采样
window.__boot && window.__boot(0.74);
const state0 = { progress: 0, time: 0 };
let texA = scenes[0].render(state0, scenes[1].fbo.texture);
let texB = scenes[1].render(state0, scenes[2].fbo.texture);
scenes[2].render(state0, null);
window.__boot && window.__boot(1);
window.__loaderPaint && window.__loaderPaint(1);
window.__loaderDone = true;
setTimeout(() => {
  if (REDUCED || matchMedia('(prefers-reduced-motion: reduce)').matches) { loader.remove(); return; }
  loader.remove(); // GL 加载页（真变形版）即刻接管，DOM 层仅作 GL 前兜底
}, 320);

const clock = new THREE.Clock();
let frameCount = 0;
const DEBUG = new URLSearchParams(location.search).has('debug');
function frame() {
  requestAnimationFrame(frame);
  frameCount++;
  if (DEBUG && frameCount % 30 === 0 && window.showErr) {
    const i = renderer.info.render;
    showErr(`[diag] draws=${i.calls} tris=${i.triangles} p=${progress.toFixed(2)}`);
  }
  const dt = Math.min(clock.getDelta(), 0.05);
  if (loaderPhase !== 'done') { // WebGL 加载页：真变形/遮罩/噪点；完成后淡出交棒
    if (loaderPhase === 'fading') {
      loaderPassMat.uniforms.uFade.value -= dt * 1.6;
      if (loaderPassMat.uniforms.uFade.value <= 0) { loaderPhase = 'done'; const el = document.getElementById('loader'); el && el.remove(); }
    } else if (window.__loaderDone) loaderPhase = 'fading';
    postQuad.material = loaderPassMat;
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCam);
    return;
  }
  const t = clock.elapsedTime;
  scroller.tick(); // 700ms easeOutCubic 决停（去弹簧长尾）
  const state = { progress, time: t };
  mouse.sx = lerp(mouse.sx, mouse.x, 0.06);
  mouse.sy = lerp(mouse.sy, mouse.y, 0.06);
  shared.uTime.value = t;

  // 鼠标权重通道（先跑，产出本帧拖尾贴图供场景/compose 采样）
  const mwTex = updateMouseWeight(t);
  scenes[1].gridMat.uniforms.uMouseW.value = mwTex;
  composeMat.uniforms.uMouseW.value = mwTex;

  // 选择性渲染 + 倒序链：END → INSIDE → HERO，next 纹理逐级下传
  let texC = scenes[2].fbo.texture, texBcur = scenes[1].fbo.texture;
  if (inRange(scenes[2], progress)) texC = scenes[2].render(state, null);
  if (inRange(scenes[1], progress)) texBcur = scenes[1].render(state, texC);
  if (inRange(scenes[0], progress)) texA = scenes[0].render(state, texBcur);

  // ---------- 错峰编排：任一时刻只发生一件事（体检结论：原 0.40–0.55 七效果同窗） ----------
  composeMat.uniforms.uSceneA.value = texA;
  composeMat.uniforms.uSceneB.value = texBcur;
  // ① 0.34–0.46 黑白退色（在切换前完成，色彩先行）
  composeMat.uniforms.uFilm.value = 1 - smoothstep(0.34, 0.46, progress);
  // ② 0.47–0.49 场景切换（此刻屏幕恰满视口、内容=A屏纹理=B场景，天然无缝——无闪断）
  composeMat.uniforms.uSwap.value = smoothstep(0.47, 0.49, progress);
  // ③ 0.49–0.55 切换后才渐入屏内遮罩（沿用与 CRT 屏窗相同的几何）
  composeMat.uniforms.uGlass.value = smoothstep(0.49, 0.55, progress);
  composeMat.uniforms.uGlassFlash.value = smoothstep(0.49, 0.53, progress);
  // ④ 终章只加对比（同遮罩系统，不再另起边框）
  composeMat.uniforms.uContact.value = smoothstep(0.86, 0.94, progress);
  composeMat.uniforms.uAberr.value = 1.4;
  postQuad.material = composeMat;
  renderer.setRenderTarget(sceneRT);
  renderer.render(postScene, postCam);

  // bloom：mip 金字塔（亮度阈值熔进首级降采样；降 ×3 → 升 ×2；低端档跳过）
  if (CFG.bloom) {
    postQuad.material = downFirstMat;
    downFirstMat.uniforms.uTex.value = sceneRT.texture;
    downFirstMat.uniforms.uTexel.value.set(1 / sceneRT.width, 1 / sceneRT.height);
    renderer.setRenderTarget(pyr.d0); renderer.render(postScene, postCam);
    postQuad.material = downMat;
    downMat.uniforms.uTex.value = pyr.d0.texture;
    downMat.uniforms.uTexel.value.set(1 / pyr.d0.width, 1 / pyr.d0.height);
    renderer.setRenderTarget(pyr.d1); renderer.render(postScene, postCam);
    downMat.uniforms.uTex.value = pyr.d1.texture;
    downMat.uniforms.uTexel.value.set(1 / pyr.d1.width, 1 / pyr.d1.height);
    renderer.setRenderTarget(pyr.d2); renderer.render(postScene, postCam);
    postQuad.material = upMat;
    upMat.uniforms.uTex.value = pyr.d2.texture; upMat.uniforms.uSupport.value = pyr.d1.texture;
    upMat.uniforms.uTexel.value.set(1 / pyr.d2.width, 1 / pyr.d2.height);
    renderer.setRenderTarget(pyr.u1); renderer.render(postScene, postCam);
    upMat.uniforms.uTex.value = pyr.u1.texture; upMat.uniforms.uSupport.value = pyr.d0.texture;
    upMat.uniforms.uTexel.value.set(1 / pyr.u1.width, 1 / pyr.u1.height);
    renderer.setRenderTarget(pyr.u0); renderer.render(postScene, postCam);
  }

  // final：辉光合成 + ACES + 扫描线/颗粒/暗角 → 屏幕（闪断已删：切换本身无缝）
  postQuad.material = finalMat;
  finalMat.uniforms.uScene.value = sceneRT.texture;
  finalMat.uniforms.uBloom.value = CFG.bloom ? pyr.u0.texture : blackTex;
  // ⑤ 0.49–0.60 切换后辉光才爬升（屏外保持极低）
  finalMat.uniforms.uBloomAmt.value = CFG.bloom ? lerp(0.1, 0.55, smoothstep(0.49, 0.60, progress)) : 0;
  finalMat.uniforms.uScan.value = lerp(0.06, 0.5, smoothstep(0.50, 0.62, progress) * (1 - smoothstep(0.86, 0.96, progress)));
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);

  // DOM 状态
  const sec = progress < 0.44 ? ['01', '信号'] : progress < 0.92 ? ['02', '屏内'] : ['03', '终章'];
  secNum.textContent = sec[0]; secName.textContent = sec[1];
  hint.style.opacity = progress < 0.02 ? 1 : 0;
  document.body.classList.toggle('inside', progress > 0.46); // DOM 覆盖层随穿屏恢复彩色
  const ht = document.getElementById('heroTitle');
  if (ht) ht.style.opacity = progress < 0.02 ? 1 : Math.max(0, 1 - smoothstep(0.02, 0.22, progress) * 1.4);
}
function inRange(s, p) { return p >= s.activeRange[0] && p <= s.activeRange[1]; }
frame();
</script>
</body>
</html>
