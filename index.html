<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iiiiiei — Phase 1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="outer-world" class="world">
    <canvas id="ascii-canvas"></canvas>

    <div id="mac-stage">
      <div id="mac" class="mac" role="img" aria-label="Retro Macintosh">
        <div class="mac-3d">
          <div class="mac-top"></div>
          <div class="mac-side-right"></div>
          <div class="mac-front">
            <div class="mac-bezel">
              <div class="mac-screen">
                <div class="mac-scanlines"></div>
                <div class="mac-noise"></div>
                <span class="mac-hint">ENTER</span>
              </div>
              <div class="mac-floppy"></div>
              <div class="mac-logo"> macintosh </div>
            </div>
          </div>
          <div class="mac-chin"></div>
        </div>
      </div>
    </div>

    <div id="scroll-hint">scroll to enter · scroll up to exit</div>
  </section>

  <section id="inner-world" class="world">
    <div class="crt-frame">
      <div class="crt-fisheye">
        <div class="crt-scanlines"></div>
        <div class="crt-vignette"></div>
        <div class="crt-noise"></div>
        <div class="crt-content">
          <h1 class="crt-text">Hello World</h1>
          <p class="crt-sub">life is art’s whisper</p>
          <p class="crt-back">scroll up to leave</p>
        </div>
      </div>
    </div>
  </section>

  <script src="main.js"></script>
</body>
</html>
