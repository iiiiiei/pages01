<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iiiiiei — Phase 1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="outer-world" class="world">
    <canvas id="ascii-canvas"></canvas>
    <div id="mac-stage">
      <div id="mac" class="cube">
        <div class="face front">
          <div class="bezel">
            <div class="crt"><span>ENTER</span></div>
          </div>
          <div class="floppy"></div>
          <div class="name">Macintosh</div>
        </div>
        <div class="face back"></div>
        <div class="face right"></div>
        <div class="face left"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
      </div>
    </div>
    <div id="scroll-hint">scroll to enter · scroll up to exit</div>
  </section>

  <section id="inner-world" class="world">
    <div class="crt-frame">
      <div class="crt-fisheye">
        <div class="crt-scanlines"></div>
        <div class="crt-vignette"></div>
        <div class="crt-noise"></div>
        <div class="crt-content">
          <h1 class="crt-text">Hello World</h1>
          <p class="crt-sub">life is art’s whisper</p>
          <p class="crt-back">scroll up to leave</p>
        </div>
      </div>
    </div>
  </section>
  <script src="main.js"></script>
</body>
</html>
